
name: Build cloudflared for FreeBSD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Cloudflare source
        uses: actions/checkout@v4
        with:
          repository: cloudflare/cloudflared
          ref: master
          path: cloudflared

      - name: Checkout FreeBSD support patch
        run: |
          git -C cloudflared fetch origin pull/1526/head:freebsd-pr-1526
          git -C cloudflared checkout freebsd-pr-1526

      - name: Build on FreeBSD 14.3
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          prepare: |
            pkg install -y go git gmake
          run: |
            freebsd-version
            uname -m
            cd cloudflared
            git describe --tags --always
            gmake TARGET_OS=freebsd TARGET_ARCH=amd64 cloudflared
            test -f cloudflared
            file cloudflared
            sha256 cloudflared
            cp cloudflared ../cloudflared-freebsd-amd64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflared-freebsd-amd64
          path: cloudflared-freebsd-amd64
          if-no-files-found: error
